<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>curam recorder</title>
<style>
  :root {
    --bg:#cfccc3; --panel:#e3e0d7; --ink:#2e2c27; --muted:#817f74;
    --line:#b3b0a5; --sel:#2e2c27; --selink:#eceae2; --warn:#8a3a2f;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line);
  }
  .brand { letter-spacing:.5px; }
  .dim { color:var(--muted); }
  .actions { display:flex; align-items:center; gap:14px; }
  .toggle { color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:5px; }
  .toggle input { accent-color:var(--ink); }
  button {
    font:inherit; color:var(--ink); background:transparent;
    border:1px solid var(--line); padding:4px 12px; cursor:pointer;
  }
  button:hover { background:var(--panel); }
  button:disabled { color:var(--muted); border-color:var(--line); cursor:default; background:transparent; }
  main { flex:1; display:flex; min-height:0; }
  #list { width:44%; border-right:1px solid var(--line); overflow-y:auto; }
  #detail { flex:1; display:flex; flex-direction:column; min-width:0; }
  .row {
    padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
  }
  .row:hover { background:var(--panel); }
  .row.sel { background:var(--sel); color:var(--selink); }
  .row.sel .meta { color:#b8b5aa; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:11px; }
  .badge { border:1px solid currentColor; padding:0 4px; margin-left:4px; opacity:.7; }
  #detail-head {
    padding:9px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  #detail-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status { color:var(--muted); font-size:11px; white-space:nowrap; }
  #status.run { color:var(--ink); }
  #status.fail { color:var(--warn); }
  #detail-body {
    flex:1; margin:0; padding:12px 14px; overflow:auto; white-space:pre-wrap;
    word-break:break-word; font:inherit; color:var(--ink); user-select:text;
  }
  #detail-body .fail { color:var(--warn); }
  #detail-body .mut { color:var(--muted); }
  .empty { padding:14px; color:var(--muted); }
  footer {
    padding:7px 14px; border-top:1px solid var(--line);
    color:var(--muted); font-size:11px; letter-spacing:.3px;
  }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--line); }
</style>
</head>
<body>
  <header>
    <div class="brand">curam <span class="dim">·</span> recorder</div>
    <div class="actions">
      <label class="toggle"><input type="checkbox" id="gen"> generate</label>
      <button id="playBtn" disabled>play</button>
      <button id="recBtn">record new</button>
      <button id="stopBtn" disabled>stop</button>
    </div>
  </header>
  <main>
    <section id="list"><div class="empty">loading…</div></section>
    <section id="detail">
      <div id="detail-head">
        <div id="detail-title" class="dim">select a recording</div>
        <div id="status"></div>
      </div>
      <pre id="detail-body"></pre>
    </section>
  </main>
  <footer>↑↓ select &nbsp;·&nbsp; ⏎ play &nbsp;·&nbsp; g play+generate &nbsp;·&nbsp; r record &nbsp;·&nbsp; esc stop</footer>

<script>
const $ = s => document.querySelector(s);
let recs = [], sel = -1, running = false;

const call = (m, a) => window.shellCall(m, a);

function relTime(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function renderList() {
  const el = $('#list');
  if (!recs.length) { el.innerHTML = '<div class="empty">no recordings yet — record new</div>'; return; }
  el.innerHTML = '';
  recs.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === sel ? ' sel' : '');
    const params = r.params.length ? `<span class="badge">${r.params.length}p</span>` : '';
    row.innerHTML = `<div class="name">${r.name}</div>`
      + `<div class="meta">${r.steps} steps${params} · ${relTime(r.mtime)}</div>`;
    row.onclick = () => selectRow(i);
    row.ondblclick = () => play(false);
    el.appendChild(row);
  });
}

async function selectRow(i) {
  if (running) return;
  sel = i; renderList();
  const r = recs[i];
  $('#detail-title').textContent = r.name;
  $('#detail-title').classList.remove('dim');
  $('#status').textContent = `${r.steps} steps` + (r.params.length ? ` · params: ${r.params.join(', ')}` : '');
  $('#status').className = '';
  $('#playBtn').disabled = false;
  const { text } = await call('open', r.name);
  const body = $('#detail-body'); body.textContent = text || '(empty)';
  $('.row.sel')?.scrollIntoView({ block:'nearest' });
}

function move(d) {
  if (running || !recs.length) return;
  selectRow(Math.max(0, Math.min(recs.length - 1, (sel < 0 ? 0 : sel + d))));
}

async function play(generate) {
  if (running || sel < 0) return;
  const r = recs[sel];
  $('#detail-body').textContent = '';
  const res = await call('play', { name: r.name, generate });
  if (res && res.error) appendLog({ line: res.error, kind: 'err' });
}

async function record() {
  if (running) return;
  $('#detail-title').textContent = 'new recording';
  $('#detail-title').classList.remove('dim');
  $('#detail-body').textContent = '';
  const res = await call('record');
  if (res && res.error) appendLog({ line: res.error, kind: 'err' });
}

function appendLog({ line, kind }) {
  const body = $('#detail-body');
  const div = document.createElement('span');
  const isFail = /^\s*FAIL:/.test(line) || kind === 'err';
  const isMut = /^\s*(skip:|\(|ok :|Cleaning|Parameters:|Generated:)/.test(line) && !isFail;
  div.className = isFail ? 'fail' : (isMut ? 'mut' : '');
  div.textContent = line + '\n';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

// ---- pushed from Node ----
window.__list = items => { recs = items; if (!running) renderList(); };
window.__log = appendLog;
window.__running = ({ label }) => {
  running = true;
  $('#status').textContent = label + ' …'; $('#status').className = 'run';
  $('#playBtn').disabled = true; $('#recBtn').disabled = true; $('#stopBtn').disabled = false;
};
window.__done = ({ kind, code }) => {
  running = false;
  const ok = code === 0 || code === null;
  $('#status').textContent = kind === 'record' ? 'recording ended' : (ok ? 'done' : `exited (${code})`);
  $('#status').className = ok ? '' : 'fail';
  $('#playBtn').disabled = sel < 0; $('#recBtn').disabled = false; $('#stopBtn').disabled = true;
};

$('#playBtn').onclick = () => play($('#gen').checked);
$('#recBtn').onclick = record;
$('#stopBtn').onclick = () => call('stop');

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); play($('#gen').checked); }
  else if (e.key === 'g') { play(true); }
  else if (e.key === 'r') { record(); }
  else if (e.key === 'Escape') { if (running) call('stop'); }
});

(function init() {
  if (!window.shellCall) return void setTimeout(init, 40);
  call('list').then(items => { recs = items; renderList(); });
})();
</script>
</body>
</html>
