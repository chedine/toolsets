<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>curam recorder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232b2a25'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23edeae1'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#eae7de; --ink:#2b2a25; --muted:#9b998d; --faint:#c3c0b5;
    --hair:#dcd9cf; --sel:#2b2a25; --selink:#eae7de; --warn:#9a4436;
    --pad:16px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:13px/1.55 ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; user-select:none;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header {
    display:flex; align-items:baseline; justify-content:space-between;
    padding:14px var(--pad) 12px;
  }
  .brand { font-size:12px; letter-spacing:1.5px; text-transform:lowercase; }
  .brand b { font-weight:600; }
  .dim { color:var(--muted); }
  .actions { display:flex; align-items:center; gap:18px; }
  .toggle { color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12px; }
  .toggle input { accent-color:var(--ink); margin:0; }
  button {
    font:inherit; font-size:12px; color:var(--ink); background:transparent;
    border:0; padding:0; cursor:pointer; letter-spacing:.3px;
    border-bottom:1px solid transparent;
  }
  button:hover:not(:disabled) { border-bottom-color:var(--ink); }
  button:disabled { color:var(--faint); cursor:default; }
  main { flex:1; display:flex; min-height:0; border-top:1px solid var(--hair); }
  #list { width:42%; overflow-y:auto; padding:6px 0; }
  #detail { flex:1; display:flex; flex-direction:column; min-width:0; border-left:1px solid var(--hair); }
  .row {
    padding:8px var(--pad); cursor:pointer; display:flex; flex-direction:column; gap:2px;
    border-left:2px solid transparent;
  }
  .row:hover { background:#e3e0d6; }
  .row.sel { background:var(--sel); color:var(--selink); border-left-color:var(--selink); }
  .row.sel .meta { color:#a9a79b; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:11px; letter-spacing:.2px; }
  .badge { color:var(--muted); }
  .row.sel .badge { color:#a9a79b; }
  #detail-head {
    padding:12px var(--pad); display:flex; align-items:baseline;
    justify-content:space-between; gap:12px; border-bottom:1px solid var(--hair);
  }
  #detail-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; letter-spacing:.3px; }
  #status { color:var(--muted); font-size:11px; white-space:nowrap; }
  #status.run { color:var(--ink); }
  #status.fail { color:var(--warn); }
  #detail-body {
    flex:1; margin:0; padding:14px var(--pad); overflow:auto; white-space:pre-wrap;
    word-break:break-word; font:inherit; font-size:12px; color:#57554c; user-select:text;
  }
  #detail-body .fail { color:var(--warn); }
  #detail-body .mut { color:var(--muted); }
  .empty { padding:16px var(--pad); color:var(--muted); }
  footer {
    padding:9px var(--pad); border-top:1px solid var(--hair);
    color:var(--muted); font-size:11px; letter-spacing:.3px;
  }
  footer kbd { color:var(--ink); font:inherit; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--faint); border-radius:0; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
  <header>
    <div class="brand">curam <span class="dim">·</span> <b>recorder</b></div>
    <div class="actions">
      <label class="toggle"><input type="checkbox" id="gen"> generate</label>
      <button id="playBtn" disabled>play</button>
      <button id="recBtn">record new</button>
      <button id="stopBtn" disabled>stop</button>
    </div>
  </header>
  <main>
    <section id="list"><div class="empty">loading…</div></section>
    <section id="detail">
      <div id="detail-head">
        <div id="detail-title" class="dim">select a recording</div>
        <div id="status"></div>
      </div>
      <pre id="detail-body"></pre>
    </section>
  </main>
  <footer><kbd>↑↓</kbd> select &nbsp;·&nbsp; <kbd>⏎</kbd> play &nbsp;·&nbsp; <kbd>g</kbd> play+generate &nbsp;·&nbsp; <kbd>r</kbd> record &nbsp;·&nbsp; <kbd>esc</kbd> stop</footer>

<script>
const $ = s => document.querySelector(s);
let recs = [], sel = -1, running = false;

const call = (m, a) => window.shellCall(m, a);

function relTime(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function renderList() {
  const el = $('#list');
  if (!recs.length) { el.innerHTML = '<div class="empty">no recordings yet — record new</div>'; return; }
  el.innerHTML = '';
  recs.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (i === sel ? ' sel' : '');
    const params = r.params.length ? `<span class="badge">${r.params.length}p</span>` : '';
    row.innerHTML = `<div class="name">${r.name}</div>`
      + `<div class="meta">${r.steps} steps${params} · ${relTime(r.mtime)}</div>`;
    row.onclick = () => selectRow(i);
    row.ondblclick = () => play(false);
    el.appendChild(row);
  });
}

async function selectRow(i) {
  if (running) return;
  sel = i; renderList();
  const r = recs[i];
  $('#detail-title').textContent = r.name;
  $('#detail-title').classList.remove('dim');
  $('#status').textContent = `${r.steps} steps` + (r.params.length ? ` · params: ${r.params.join(', ')}` : '');
  $('#status').className = '';
  $('#playBtn').disabled = false;
  const { text } = await call('open', r.name);
  const body = $('#detail-body'); body.textContent = text || '(empty)';
  $('.row.sel')?.scrollIntoView({ block:'nearest' });
}

function move(d) {
  if (running || !recs.length) return;
  selectRow(Math.max(0, Math.min(recs.length - 1, (sel < 0 ? 0 : sel + d))));
}

async function play(generate) {
  if (running || sel < 0) return;
  const r = recs[sel];
  $('#detail-body').textContent = '';
  const res = await call('play', { name: r.name, generate });
  if (res && res.error) appendLog({ line: res.error, kind: 'err' });
}

async function record() {
  if (running) return;
  $('#detail-title').textContent = 'new recording';
  $('#detail-title').classList.remove('dim');
  $('#detail-body').textContent = '';
  const res = await call('record');
  if (res && res.error) appendLog({ line: res.error, kind: 'err' });
}

function appendLog({ line, kind }) {
  const body = $('#detail-body');
  const div = document.createElement('span');
  const isFail = /^\s*FAIL:/.test(line) || kind === 'err';
  const isMut = /^\s*(skip:|\(|ok :|Cleaning|Parameters:|Generated:)/.test(line) && !isFail;
  div.className = isFail ? 'fail' : (isMut ? 'mut' : '');
  div.textContent = line + '\n';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

// ---- pushed from Node ----
window.__list = items => { recs = items; if (!running) renderList(); };
window.__log = appendLog;
window.__running = ({ label }) => {
  running = true;
  $('#status').textContent = label + ' …'; $('#status').className = 'run';
  $('#playBtn').disabled = true; $('#recBtn').disabled = true; $('#stopBtn').disabled = false;
};
window.__done = ({ kind, code }) => {
  running = false;
  const ok = code === 0 || code === null;
  $('#status').textContent = kind === 'record' ? 'recording ended' : (ok ? 'done' : `exited (${code})`);
  $('#status').className = ok ? '' : 'fail';
  $('#playBtn').disabled = sel < 0; $('#recBtn').disabled = false; $('#stopBtn').disabled = true;
};

$('#playBtn').onclick = () => play($('#gen').checked);
$('#recBtn').onclick = record;
$('#stopBtn').onclick = () => call('stop');

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); play($('#gen').checked); }
  else if (e.key === 'g') { play(true); }
  else if (e.key === 'r') { record(); }
  else if (e.key === 'Escape') { if (running) call('stop'); }
});

(function init() {
  if (!window.shellCall) return void setTimeout(init, 40);
  call('list').then(items => { recs = items; renderList(); });
})();
</script>
</body>
</html>
