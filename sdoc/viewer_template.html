  const OPS = {
    "equal to": (a, b) => cmp(a, b) === 0, "not equal to": (a, b) => cmp(a, b) !== 0,
    "<": (a, b) => cmp(a, b) < 0, ">": (a, b) => cmp(a, b) > 0,
    "<=": (a, b) => cmp(a, b) <= 0, ">=": (a, b) => cmp(a, b) >= 0,
  };
  function cmp(a, b) {
    const na = num(a), nb = num(b);
    if (na !== null && nb !== null) return na < nb ? -1 : na > nb ? 1 : 0;
    const da = a != null && parseDate(String(a)), db = b != null && parseDate(String(b));
    if (da && db) return da < db ? -1 : da > db ? 1 : 0;
    const sa = String(a ?? "null"), sb = String(b ?? "null");
    return sa < sb ? -1 : sa > sb ? 1 : 0;
  }
  function evalCompare(cs, env) {
    const i = cs.findIndex(x => OPS[txt(x)]);
    if (i < 1 || i === cs.length - 1) return OPAQUE;
    const op = OPS[txt(cs[i])];
    const l = evalSeq(cs.slice(0, i), env), r = evalSeq(cs.slice(i + 1), env);
    if (l === OPAQUE || r === OPAQUE) return OPAQUE;
    const tainted = l.tainted || r.tainted;
    if (!l.known || !r.known) return unknown(tainted);
    // comparing objects makes no sense scalar-wise
    if (typeof l.v === "object" && l.v || typeof r.v === "object" && r.v) return OPAQUE;
    return known(String(op(l.v, r.v)), tainted);
  }

  const ARITH = { "+": (a, b) => a + b, "-": (a, b) => a - b,
                  "*": (a, b) => a * b, "/": (a, b) => b === 0 ? null : a / b };
  function evalArith(cs, env) {
    const i = cs.findIndex(x => ARITH[txt(x)]);
    if (i < 1 || i === cs.length - 1) return OPAQUE;
    const l = evalSeq(cs.slice(0, i), env), r = evalSeq(cs.slice(i + 1), env);
    if (l === OPAQUE || r === OPAQUE) return OPAQUE;
    const tainted = l.tainted || r.tainted;
    if (!l.known || !r.known) return unknown(tainted);
    const nl = num(l.v), nr = num(r.v);
    if (nl === null || nr === null) return OPAQUE;
    const v = ARITH[txt(cs[i])](nl, nr);
    return v === null ? OPAQUE : known(String(v), tainted);
  }

  function evalProp(p, cs, env) {
    if (p === "size" && cs.length === 1) {
      const src = evalList(cs[0], env);
      if (src !== OPAQUE && src.known && src.members)
        return known(String(src.members.length), src.tainted);
      if (src !== OPAQUE && src.known === false) return src;
    }
    const base = evalSeq(cs, env);
    if (base === OPAQUE) return OPAQUE;
    if (!base.known) return base;
    if (p === "getCode") return base;               // code value passthrough
    if (p === "size" && isRefList(base.v)) return known(String(base.v.list.length), base.tainted);
    if (isRef(base.v)) {
      const next = evalAttr(base.v.ref, p, env.ctx);
      return { ...next, tainted: next.tainted || base.tainted };
    }
    return OPAQUE;
  }

  function evalExistence(cs, env) {
    const part = {};
    for (const it of cs) {
      const t = txt(it), sub = meaningful(it.c);
      if (/^Initial pre-existence/.test(t)) part.v0 = evalSeq(sub, env);
      else if (/^Until the start/.test(t)) part.d1 = evalSeq(sub, env);
      else if (/^Then value during/.test(t)) part.v1 = evalSeq(sub, env);
      else if (/^Until the end/.test(t)) part.d2 = evalSeq(sub, env);
      else if (/^Then value post/.test(t)) part.v2 = evalSeq(sub, env);
    }
    const ps = [part.v0, part.d1, part.v1, part.d2, part.v2];
    if (ps.some(p => !p || p === OPAQUE)) return OPAQUE;
    const tainted = ps.some(p => p.tainted);
    if (ps.some(p => !p.known)) return unknown(tainted);
    const D1 = part.d1.v && parseDate(String(part.d1.v));
    const D2 = part.d2.v && parseDate(String(part.d2.v));
    if (!D1 && !D2) return OPAQUE;
    if (D1 && env.ctx.when < D1) return known(part.v0.v, tainted);
    if (!D2 || env.ctx.when <= D2) return known(part.v1.v, tainted);
    return known(part.v2.v, tainted);
  }

  function evalTable(tbl, env) {
    let tainted = false;
    for (const row of tbl.rows) {
      if (row.length < 2) continue;
      const condItems = meaningful(row[0]);
      const isElse = condItems.length === 1 && /^Otherwise\.?$/.test(txt(condItems[0]));
      const cond = isElse ? known("true", false) : evalSeq(condItems, env);
      if (cond === OPAQUE) return OPAQUE;
      tainted = tainted || cond.tainted;
      if (!cond.known) return unknown(tainted);
      if (cond.v === "true") {
        const then = evalSeq(row[row.length - 1], env);
        if (then === OPAQUE) return OPAQUE;
        return { ...then, tainted: then.tainted || tainted };
      }
      if (cond.v !== "false") return OPAQUE;
    }
    return known(null, tainted);        // no row matched
  }

  /* replay the whole dump with no overrides and compare against it */
  function selfTest(when) {
    const ctx = newCtx(when);
    const stats = { computed: 0, match: 0, mismatch: 0, opaque: 0, leaf: 0,
                    stale: 0, other: 0, examples: [] };
    for (const [oid, ob] of Object.entries(objects)) {
      for (const an of Object.keys(ob.attrs)) {
        const res = evalAttr(oid, an, ctx);
        if (res.why === "leaf") stats.leaf++;
        else if (res.why === "opaque") stats.opaque++;
        else if (res.why === "computed") {
          const at = getAttr(oid, an);
          if (at.state === "ERROR") { stats.other++; continue; }  // dump has no truth to compare
          stats.computed++;
          const base = scalarize(at.value, when);
          const same = typeof res.v === "object" || typeof base === "object"
            ? true   // object refs: structural identity not meaningful here
            : String(res.v ?? "null") === String(base ?? "null");
          if (same) stats.match++;
          else {
            stats.mismatch++;
            if (stats.examples.length < 12)
              stats.examples.push([oid, an, String(res.v), String(base)]);
          }
        }
        else if (res.why === "stale") stats.stale++;
        else stats.other++;
      }
    }
    return stats;
  }

  return { evalAttr, scalarize, newCtx, selfTest, OPAQUE };
})({ getAttr, key, parseDate, tlValueAt, isTL, isRef, isRefList, objects: DATA.objects });

/* what-if UI state */
const wiOverrides = new Map();     // key(o,a) -> scalar string
function wiWhen() {
  const d = asOf ? new Date(asOf) : new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}
window.__wiSelfTest = () => JSON.stringify(WI.selfTest(wiWhen()));

function wiChip(o, a, ctx) {
  if (!ctx) return null;
  const res = WI.evalAttr(o, a, ctx);
  if (wiOverrides.has(key(o, a)))
    return h("span", { class: "wichip ov" }, "✎ " + (res.v ?? "null"));
  if (!res.known) return res.tainted ? h("span", { class: "wichip stale" }, "stale") : null;
  const at = getAttr(o, a);
  const base = at ? WI.scalarize(at.value, ctx.when) : null;
  if (typeof res.v !== "object" && typeof base !== "object" &&
      String(res.v ?? "null") !== String(base ?? "null"))
    return h("span", { class: "wichip now" }, "→ " + (res.v ?? "null"));
  return null;
}

function wiEdit(row, o, a) {
  const k = key(o, a);
  const at = getAttr(o, a);
  const cur = wiOverrides.has(k) ? wiOverrides.get(k)
    : String((at && WI.scalarize(at.value, wiWhen())) ?? "");
  const commit = v => {
    if (v === "" || v === cur && !wiOverrides.has(k)) wiOverrides.delete(k);
    else wiOverrides.set(k, v);
    render(current);
  };
  const inp = h("input", { class: "wiinput", value: cur,
    onclick: ev => ev.stopPropagation(),
    onkeydown: ev => {
      if (ev.key === "Enter") commit(inp.value);
      else if (ev.key === "Escape") render(current);
    } });
  row.dataset.editing = "1";
  row.replaceChildren(
    h("span", { class: "name" }, a + " :="), inp,
    h("button", { class: "wibtn", onclick: ev => { ev.stopPropagation(); commit(inp.value); } },
      "try it"),
    wiOverrides.has(k)
      ? h("button", { class: "wibtn", onclick: ev => { ev.stopPropagation(); commit(""); } },
          "reset")
      : null);
  inp.focus(); inp.select();
}

/* ------------------------------------------------------- graph view */
let gDepth = 3;
let gDir = "deps";           // "deps" = what root depends on; "used" = what uses root

function gNeighbors(o, a) {
  if (gDir === "deps") {
    const at = getAttr(o, a);
    return at ? at.deps : [];
  }
  return usedBy[key(o, a)] || [];
}

/* shared toolbar controls for graph + lanes */
function depthSelect() {
  const sel = h("select", null, [3, 5, 10, 15, 20].map(n => {
    const opt = h("option", { value: n }, n + " levels");
    if (n === gDepth) opt.selected = true;
    return opt;
  }));
  sel.addEventListener("change", () => { gDepth = +sel.value; render(current); });
  return sel;
}
function dirButtons() {
  const b = (label, val) => {
    const on = gDir === val;
    return h("button", { class: "gdir" + (on ? " on" : ""),
      onclick: () => { if (gDir !== val) { gDir = val; render(current); } } }, label);
  };
  return h("span", { class: "gdirs" }, b("depends on", "deps"), b("used by", "used"));
}

function buildGraph(rootO, rootA, depth, cap) {
  cap = cap || 400;
  const nodes = new Map();   // key -> {o, a, d}
  const edges = [];          // {from: parentKey, to: depKey}
  const seenEdge = new Set();
  const q = [[rootO, rootA, 0]];
  nodes.set(key(rootO, rootA), { o: rootO, a: rootA, d: 0 });
  let truncated = false;
  while (q.length) {
    const [o, a, d] = q.shift();
    if (d >= depth) continue;
    for (const [dO, dA] of gNeighbors(o, a)) {
      const dk = key(dO, dA);
      if (!nodes.has(dk)) {
        if (nodes.size >= cap) { truncated = true; continue; }
        nodes.set(dk, { o: dO, a: dA, d: d + 1 });
        q.push([dO, dA, d + 1]);
      }
      const ek = key(o, a) + "→" + dk;
      if (!seenEdge.has(ek)) { seenEdge.add(ek); edges.push({ from: key(o, a), to: dk }); }
    }
  }
  return { nodes, edges, truncated };
}

function layoutGraph(g) {
  const COLW = 260, ROWH = 72, PAD = 30;
  const layers = [];
  for (const [k, n] of g.nodes) (layers[n.d] ||= []).push(k);
  const pos = new Map();
  // initial order = insertion; then 3 barycenter passes on parent y
  const parentsOf = new Map();
  for (const e of g.edges) (parentsOf.get(e.to) || parentsOf.set(e.to, []).get(e.to)).push(e.from);
  layers.forEach((layer, d) => {
    if (d > 0) {
      const prevY = k => {
        const ps = (parentsOf.get(k) || []).map(p => pos.get(p)).filter(Boolean);
        return ps.length ? ps.reduce((s, p) => s + p.y, 0) / ps.length : 1e9;
      };
      layer.sort((a, b) => prevY(a) - prevY(b));
    }
    layer.forEach((k, i) => pos.set(k, { x: PAD + d * COLW, y: PAD + i * ROWH }));
  });
  const width = PAD * 2 + layers.length * COLW;
  const height = PAD * 2 + Math.max(...layers.map(l => l.length), 1) * ROWH;
  return { pos, width, height };
}

function renderGraph(rootO, rootA) {
  const at = getAttr(rootO, rootA);
  if (!at) { view.append(h("div", { class: "empty" }, "not found")); return; }
  view.style.maxWidth = "none";      // graph uses full width
  const g = buildGraph(rootO, rootA, gDepth);
  const { pos, width, height } = layoutGraph(g);

  /* toolbar */
  view.append(h("div", { class: "gtoolbar" },
    h("span", null, h("b", null, rootA), " —"),
    dirButtons(),
    depthSelect(),
    h("button", { class: "btn", onclick: () => go({ v: "trace", o: rootO, a: rootA }) },
      "☰ card view"),
    h("button", { class: "btn", onclick: () => go({ v: "lanes", o: rootO, a: rootA }) },
      "⧗ lanes"),
    h("span", { class: "hint" },
      g.nodes.size + " nodes · " + g.edges.length + " edges" +
      (g.truncated ? " · truncated" : "") + " · drag to pan, wheel to zoom, click a node")));

  /* canvas */
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", width); svg.setAttribute("height", height);
  const edgeEls = new Map();
  const NODE_W = 210, NODE_H = 52;
  for (const e of g.edges) {
    const p1 = pos.get(e.from), p2 = pos.get(e.to);
    if (!p1 || !p2) continue;
    const x1 = p1.x + NODE_W, y1 = p1.y + NODE_H / 2,
          x2 = p2.x, y2 = p2.y + NODE_H / 2, mx = (x1 + x2) / 2;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    path.setAttribute("class", "gedge");
    svg.append(path);
    (edgeEls.get(e.from) || edgeEls.set(e.from, []).get(e.from)).push(path);
    (edgeEls.get(e.to) || edgeEls.set(e.to, []).get(e.to)).push(path);
  }

  const canvas = h("div", { class: "gcanvas" });
  canvas.append(svg);
  const wrap = h("div", { class: "gwrap" });
  let selK = null;
  const nodeEls = new Map();
  for (const [k, n] of g.nodes) {
    const p = pos.get(k);
    const nAt = getAttr(n.o, n.a);
    const st = nAt ? nAt.state : "";
    let sv = nAt ? shortVal(nAt.value, 30) : "?";
    if (/^Undescribed instance/.test(sv)) sv = "";
    const nNext = gNeighbors(n.o, n.a).length;
    const hidden = n.d === gDepth && nNext > 0;   // frontier with unexpanded neighbors
    const el = h("div", { class: "gnode " + st + (k === key(rootO, rootA) ? " sel" : ""),
      style: `left:${p.x}px; top:${p.y}px;` },
      hidden ? h("span", { class: "gmore" }, "+" + nNext) : null,
      h("div", { class: "gv" }, sv || " "),
      h("div", { class: "gn" }, n.a),
      h("div", { class: "go" }, shortType(n.o)));
    el.addEventListener("click", ev => { ev.stopPropagation(); select(k); });
    nodeEls.set(k, el);
    canvas.append(el);
  }
  wrap.append(canvas);

  /* selection panel */
  let panel = null;
  function select(k) {
    if (selK) {
      nodeEls.get(selK)?.classList.remove("sel");
      (edgeEls.get(selK) || []).forEach(p => p.classList.remove("hl"));
    }
    selK = k;
    const n = g.nodes.get(k);
    nodeEls.get(k)?.classList.add("sel");
    (edgeEls.get(k) || []).forEach(p => p.classList.add("hl"));
    panel?.remove();
    const pAt = getAttr(n.o, n.a);
    const depMap = {};
    if (pAt) for (const [dO, dA] of pAt.deps) if (!depMap[dA]) depMap[dA] = [dO, dA];
    panel = h("div", { class: "gpanel", onclick: ev => ev.stopPropagation() },
      h("button", { class: "close", onclick: () => { panel.remove(); panel = null; } }, "✕"),
      h("div", { class: "aname" }, n.a),
      h("div", { class: "row" }, stateChip(pAt ? pAt.state : ""),
        h("span", { class: "objlink", style: "cursor:pointer; color:var(--muted); font-size:12px",
          onclick: () => go({ v: "obj", o: n.o }) }, objLabel(n.o))),
      h("div", { class: "lbl" }, "value"),
      pAt && isRef(pAt.value)
        ? h("div", { class: "v" }, h("span", { class: "tok",
            onclick: () => go({ v: "obj", o: pAt.value.ref }) }, shortType(pAt.value.ref)))
        : h("div", { class: "v" }, pAt ? shortVal(pAt.value, 300) : "?"),
      pAt && isTL(pAt.value) ? tlTable(pAt.value.tl) : null,
      h("div", { class: "lbl" }, "ƒx"),
      h("div", { class: "deriv" },
        pAt && pAt.deriv.length ? renderDeriv(pAt.deriv, depMap)
          : h("i", null, "No derivation — " +
              (pAt && pAt.state === "SPECIFIED" ? "specified externally." : "n/a."))),
      h("div", { class: "row", style: "margin-top:14px" },
        h("button", { class: "btn", style: "border:1px solid var(--hairline); background:none; color:var(--accent); border-radius:6px; padding:3px 10px; cursor:pointer; font:inherit; font-size:12px",
          onclick: () => go({ v: "trace", o: n.o, a: n.a }) }, "☰ open card"),
        h("button", { class: "btn", style: "border:1px solid var(--hairline); background:none; color:var(--accent); border-radius:6px; padding:3px 10px; cursor:pointer; font:inherit; font-size:12px",
          onclick: () => go({ v: "graph", o: n.o, a: n.a }) }, "⊞ re-root graph here")));
    wrap.append(panel);
  }
  wrap.addEventListener("click", () => { if (panel) { panel.remove(); panel = null; } });

  /* pan & zoom */
  let tx = 20, ty = 20, scale = 1;
  const apply = () => canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  apply();
  let drag = null;
  wrap.addEventListener("mousedown", ev => {
    if (ev.target.closest(".gnode") || ev.target.closest(".gpanel")) return;
    drag = { x: ev.clientX - tx, y: ev.clientY - ty };
    wrap.classList.add("panning");
  });
  window.addEventListener("mousemove", ev => {
    if (drag) { tx = ev.clientX - drag.x; ty = ev.clientY - drag.y; apply(); }
  });
  window.addEventListener("mouseup", () => { drag = null; wrap.classList.remove("panning"); });
  wrap.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = wrap.getBoundingClientRect();
    const cx = ev.clientX - r.left, cy = ev.clientY - r.top;
    const s2 = Math.min(2, Math.max(0.25, scale * Math.exp(-ev.deltaY * 0.0015)));
    tx = cx - (cx - tx) * (s2 / scale); ty = cy - (cy - ty) * (s2 / scale);
    scale = s2; apply();
  }, { passive: false });

  view.append(wrap);
  select(key(rootO, rootA));
}

/* ---------------------------------------------------- timeline lanes */
const LANE_COLORS = ["#1baf7a", "#eda100", "#9085e9", "#e87ba4", "#eb6834",
                     "#0ca30c", "#d03b3b", "#2a78d6"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

let gRange = "4y";           // "4y" = ±2 years around today; "full" = every boundary

function collectLanes(rootO, rootA, maxLanes) {
  // BFS in the active direction; every attr is a lane (fixed values included)
  const lanes = [];
  const seen = new Set([key(rootO, rootA)]);
  const q = [[rootO, rootA, 0]];
  let truncated = false;
  while (q.length) {
    if (lanes.length >= maxLanes) { truncated = true; break; }
    const [o, a, d] = q.shift();
    const at = getAttr(o, a);
    if (!at) continue;
    lanes.push({ o, a, d, at });
    if (d < gDepth) for (const [dO, dA] of gNeighbors(o, a)) {
      const k = key(dO, dA);
      if (!seen.has(k)) { seen.add(k); q.push([dO, dA, d + 1]); }
    }
  }
  return { lanes, truncated };
}

function renderLanes(rootO, rootA) {
  const rootAt = getAttr(rootO, rootA);
  if (!rootAt) { view.append(h("div", { class: "empty" }, "not found")); return; }
  view.style.maxWidth = "none";
  const { lanes, truncated } = collectLanes(rootO, rootA, 40);

  /* shared time domain from every finite interval boundary */
  const bounds = [];
  for (const l of lanes) if (isTL(l.at.value))
    for (const [f, t] of l.at.value.tl)
      for (const d of [parseDate(f), parseDate(t)])
        if (d) bounds.push(d);
  bounds.sort((a, b) => a - b);
  if (!bounds.length) {
    view.append(h("div", { class: "empty" },
      "No timeline values among these attributes — nothing to plot. ",
      h("a", { class: "plain", onclick: () => go({ v: "trace", o: rootO, a: rootA }) },
        "open card view →")));
    return;
  }
  let min, max, clipped = false;
  if (gRange === "4y") {
    // eligibility work lives around "now" — last 2 + next 2 years by default
    const now = new Date();
    min = new Date(now.getFullYear() - 2, now.getMonth(), 1);
    max = new Date(now.getFullYear() + 2, now.getMonth(), 1);
    clipped = bounds[0] < min || bounds[bounds.length - 1] > max;
  } else {
    min = bounds[0]; max = bounds[bounds.length - 1];
    // frame the ROOT's own boundaries — dep intervals often span decades of
    // sentinel dates and would crush the busy region
    const rootBounds = isTL(rootAt.value)
      ? rootAt.value.tl.flatMap(([f, t]) => [parseDate(f), parseDate(t)]).filter(Boolean)
      : [];
    if (rootBounds.length >= 2) {
      const rMin = new Date(Math.min(...rootBounds)), rMax = new Date(Math.max(...rootBounds));
      const pad = Math.max((rMax - rMin) * 0.15, 90 * 864e5);
      const fMin = new Date(Math.max(+rMin - pad, +min)), fMax = new Date(Math.min(+rMax + pad, +max));
      clipped = +fMin > +min || +fMax < +max;
      min = fMin; max = fMax;
    }
    if (+min === +max) { min = new Date(+min - 180 * 864e5); max = new Date(+max + 180 * 864e5); }
  }
  const span = max - min;
  const t0 = new Date(+min - span * 0.05), t1 = new Date(+max + span * 0.07);
  const X = d => ((d - t0) / (t1 - t0)) * 100;

  view.append(h("div", { class: "gtoolbar" },
    h("span", null, h("b", null, rootA), " —"),
    dirButtons(),
    depthSelect(),
    h("button", { class: "btn",
      onclick: () => { gRange = gRange === "4y" ? "full" : "4y"; render(current); } },
      gRange === "4y" ? "⟷ full range" : "⟷ ±2 years"),
    h("button", { class: "btn", onclick: () => go({ v: "trace", o: rootO, a: rootA }) },
      "☰ card view"),
    h("button", { class: "btn", onclick: () => go({ v: "graph", o: rootO, a: rootA }) },
      "⊞ graph"),
    h("span", { class: "hint" }, lanes.length + " lanes" + (truncated ? " (capped)" : "") +
      (clipped ? " · clipped, intervals run off the edges" : "") +
      " · dashed = " + rootA +
      " changes · hover to inspect · click to pin as-of date")));

  /* axis ticks: months up to ~5y spans (decimated below), years otherwise */
  const step = (t1 - t0) / 864e5 <= 1900 ? "m" : "y";
  const tickDates = [];
  let cd = step === "m" ? new Date(t0.getFullYear(), t0.getMonth(), 1)
                        : new Date(t0.getFullYear(), 0, 1);
  while (cd <= t1) {
    if (cd >= t0) tickDates.push(new Date(cd));
    cd = step === "m" ? new Date(cd.getFullYear(), cd.getMonth() + 1, 1)
                      : new Date(cd.getFullYear() + 1, 0, 1);
  }
  if (tickDates.length > 14) {
    const k = Math.ceil(tickDates.length / 14);
    for (let i = tickDates.length - 1; i >= 0; i--)
      if ((step === "m" ? tickDates[i].getMonth() : tickDates[i].getFullYear()) % k)
        tickDates.splice(i, 1);
  }
  const fmtTick = d => step === "m"
    ? MONTHS[d.getMonth()] + (d.getMonth() === 0 ? " " + d.getFullYear() : "")
    : String(d.getFullYear());

  const box = h("div", { class: "lanes" });
  const dateCell = h("div", { class: "lcurcol", style: "font-weight:600" });
  box.append(h("div", { class: "lrow laxis" },
    h("div", { class: "llabel", style: "cursor:default" }),
    h("div", { class: "ltrack" },
      tickDates.map(d => h("span", { class: "ltick", style: "left:" + X(d) + "%" }, fmtTick(d)))),
    dateCell));

  const valCells = [];
  for (const l of lanes) {
    const track = h("div", { class: "ltrack" });
    for (const d of tickDates)
      track.append(h("i", { class: "lgrid", style: "left:" + X(d) + "%" }));
    if (isTL(l.at.value)) {
      const vmap = new Map();
      for (const [f, t, v] of l.at.value.tl) {
        const df = parseDate(f), dt = parseDate(t);
        const x1 = df ? Math.max(X(df), 0) : 0;
        const x2 = dt ? Math.min(X(dt), 100) : 100;
        if (x1 >= 100 || x2 <= 0) continue;   // interval entirely outside the axis
        let color;
        if (v === "true") color = "var(--accent)";
        else if (v === "false" || v === "null") color = "#898781";
        else {
          if (!vmap.has(v)) vmap.set(v, LANE_COLORS[vmap.size % LANE_COLORS.length]);
          color = vmap.get(v);
        }
        track.append(h("div", { class: "lseg" + (v === "false" || v === "null" ? " off" : ""),
          title: f + " → " + t + " : " + v,
          style: `left:${x1}%; width:${Math.max(x2 - x1, 0.4)}%; --c:${color}` },
          h("span", null, v)));
      }
    } else {
      track.append(h("div", { class: "lflat" }, shortVal(l.at.value, 44) + " · fixed"));
    }
    const vc = h("div", { class: "lcurcol" });
    valCells.push([l, vc]);
    box.append(h("div", { class: "lrow" + (l.d === 0 ? " root" : "") },
      h("div", { class: "llabel", style: "padding-left:" + (10 + Math.min(l.d, 3) * 12) + "px",
        title: objDesc(l.o),
        onclick: ev => { ev.stopPropagation(); go({ v: "trace", o: l.o, a: l.a }); } },
        h("div", { class: "ln" }, l.a), h("div", { class: "lo" }, shortType(l.o))),
      track, vc));
  }

  /* overlay spanning the track column: root-change markers + hover cursor */
  const overlay = h("div", { class: "loverlay" });
  if (isTL(rootAt.value)) {
    const seenD = new Set();
    for (const [f] of rootAt.value.tl) {
      const d = parseDate(f);
      if (d && !seenD.has(+d) && X(d) >= 0 && X(d) <= 100)
        { seenD.add(+d); overlay.append(h("i", { class: "lmark", style: "left:" + X(d) + "%" })); }
    }
  }
  const cursor = h("i", { class: "lcursor", style: "display:none" });
  overlay.append(cursor);
  box.append(overlay);

  const today0 = new Date();
  today0.setHours(0, 0, 0, 0);
  function setCursor(d) {
    d = d || today0;   // resting state is always a real date, never blank
    dateCell.textContent = d.toLocaleDateString();
    for (const [l, vc] of valCells)
      vc.textContent = d
        ? (isTL(l.at.value) ? (tlValueAt(l.at.value.tl, d) ?? "—") : shortVal(l.at.value, 14))
        : "";
    if (d && d >= t0 && d <= t1) { cursor.style.display = ""; cursor.style.left = X(d) + "%"; }
    else cursor.style.display = "none";
  }
  const frAt = ev => {
    const r = overlay.getBoundingClientRect();
    return r.width ? (ev.clientX - r.left) / r.width : NaN;
  };
  box.addEventListener("mousemove", ev => {
    const fr = frAt(ev);
    if (!isFinite(fr) || fr < 0 || fr > 1) { setCursor(asOf); return; }
    setCursor(new Date(+t0 + fr * (t1 - t0)));
  });
  box.addEventListener("mouseleave", () => setCursor(asOf));
  box.addEventListener("click", ev => {
    const fr = frAt(ev);
    if (!isFinite(fr) || fr < 0 || fr > 1) return;
    asOf = new Date(+t0 + fr * (t1 - t0));
    asOf.setHours(0, 0, 0, 0);
    document.getElementById("asof").value =
      asOf.getFullYear() + "-" + String(asOf.getMonth() + 1).padStart(2, "0") +
      "-" + String(asOf.getDate()).padStart(2, "0");
    render(current);
  });

  view.append(box);
  setCursor(asOf);
}

/* ------------------------------------------------------- views */
const view = document.getElementById("view");
const history = [];
let current = null;

function locHash(loc) {
  if (loc.v === "graph") return "#g/" + encodeURIComponent(loc.o) + "/" + encodeURIComponent(loc.a);
  if (loc.v === "lanes") return "#l/" + encodeURIComponent(loc.o) + "/" + encodeURIComponent(loc.a);
  if (loc.v === "trace") return "#t/" + encodeURIComponent(loc.o) + "/" + encodeURIComponent(loc.a);
  if (loc.v === "obj") return "#o/" + encodeURIComponent(loc.o);
  if (loc.v === "ruleset") return "#r/" + encodeURIComponent(loc.name);
  if (loc.v === "errors") return "#e";
  return "#";
}
function parseHash(hash) {
  const p = (hash || "").replace(/^#/, "").split("/").map(decodeURIComponent);
  if (p[0] === "g" && p[2]) return { v: "graph", o: p[1], a: p[2] };
  if (p[0] === "l" && p[2]) return { v: "lanes", o: p[1], a: p[2] };
  if (p[0] === "t" && p[2]) return { v: "trace", o: p[1], a: p[2] };
  if (p[0] === "o" && p[1]) return { v: "obj", o: p[1] };
  if (p[0] === "r" && p[1]) return { v: "ruleset", name: p[1] };
  if (p[0] === "e") return { v: "errors" };
  return { v: "home" };
}
function go(loc, replace) {
  if (current && !replace) history.push(current);
  current = loc;
  document.getElementById("backBtn").disabled = history.length === 0;
  window.history.replaceState(null, "", locHash(loc));
  render(loc);
}
document.getElementById("backBtn").addEventListener("click", () => {
  if (history.length) { current = history.pop(); render(current); }
  document.getElementById("backBtn").disabled = history.length === 0;
});

function render(loc) {
  view.replaceChildren();
  view.style.maxWidth = "";
  document.getElementById("main").scrollTop = 0;
  if (loc.v === "trace") {
    const i = trail.findIndex(t => t.o === loc.o && t.a === loc.a);
    if (i >= 0) trail = trail.slice(0, i + 1);
    else if (loc.ext) trail.push({ o: loc.o, a: loc.a });
    else trail = [{ o: loc.o, a: loc.a }];
    renderFocus(loc.o, loc.a);
  }
  else if (loc.v === "graph") renderGraph(loc.o, loc.a);
  else if (loc.v === "lanes") renderLanes(loc.o, loc.a);
  else if (loc.v === "home") renderHome();
  else if (loc.v === "obj") renderObject(loc.o);
  else if (loc.v === "ruleset") renderRuleset(loc.name);
  else if (loc.v === "errors") renderErrors();
}

function renderHome() {
  const m = DATA.meta;
  view.append(
    h("div", { class: "tiles" },
      tile(m.objects, "rule objects"),
      tile(m.attributes, "attributes"),
      tile(m.edges, "dependency edges"),
      h("div", { class: "tile err", onclick: () => go({ v: "errors" }), style: "cursor:pointer" },
        h("div", { class: "v" }, String(errAttrs.length)),
        h("div", { class: "k" }, errRoots.length + " root causes — view →"))));

  if (errRoots.length) {
    view.append(h("h2", { class: "sec" }, "Error root causes"));
    const card = h("div", { class: "card" });
    for (const [o, a] of errRoots.slice(0, 12)) {
      card.append(h("div", { class: "rowline", onclick: () => go({ v: "trace", o, a }) },
        stateChip("ERROR"), h("span", { class: "name" }, a),
        h("span", { class: "sub", title: objDesc(o) }, objLabel(o))));
    }
    if (errRoots.length > 12) {
      card.append(h("div", { class: "rowline", onclick: () => go({ v: "errors" }) },
        h("a", { class: "plain" }, "all " + errRoots.length + " root causes →")));
    }
    view.append(card);
  }

  view.append(h("h2", { class: "sec" }, "Rule sets"));
  const card = h("div", { class: "card" });
  for (const name of Object.keys(DATA.rulesets).sort()) {
    card.append(h("div", { class: "rowline", onclick: () => go({ v: "ruleset", name }) },
      h("span", { class: "name" }, name),
      h("span", { class: "sub" }, ""),
      h("span", { class: "cnt" }, DATA.rulesets[name].length + " objects")));
  }
  view.append(card);
  function tile(v, k) {
    return h("div", { class: "tile" }, h("div", { class: "v" }, String(v)),
             h("div", { class: "k" }, k));
  }
}

function renderErrors() {
  view.append(h("h2", { class: "sec" }, "Error root causes (" + errRoots.length + ")"),
    listCard(errRoots),
    h("h2", { class: "sec" }, "All ERROR attributes (" + errAttrs.length + ")"),
    listCard(errAttrs));
  function listCard(list) {
    const card = h("div", { class: "card" });
    for (const [o, a] of list) {
      card.append(h("div", { class: "rowline", onclick: () => go({ v: "trace", o, a }) },
        stateChip("ERROR"), h("span", { class: "name" }, a),
        h("span", { class: "sub", title: objDesc(o) }, objLabel(o))));
    }
    if (!list.length) card.append(h("div", { class: "empty" }, "none"));
    return card;
  }
}

function renderRuleset(name) {
  view.append(h("h2", { class: "sec" }, name));
  const card = h("div", { class: "card" });
  for (const oid of DATA.rulesets[name] || []) {
    const ob = DATA.objects[oid];
    const nErr = Object.values(ob.attrs).filter(a => a.state === "ERROR").length;
    card.append(h("div", { class: "rowline", onclick: () => go({ v: "obj", o: oid }) },
      h("span", { class: "name" }, objLabel(oid)),
      h("span", { class: "sub" }, ob.desc || ""),
      nErr ? h("span", { class: "chip ERROR" }, nErr + " errors") : null,
      h("span", { class: "cnt" }, Object.keys(ob.attrs).length + " attrs")));
  }
  view.append(card);
}

function renderObject(oid) {
  const ob = DATA.objects[oid];
  if (!ob) { view.append(h("div", { class: "empty" }, "Unknown object " + oid)); return; }
  const card = h("div", { class: "card" });
  card.append(h("div", { class: "objhead" },
    h("div", { class: "desc" }, objLabel(oid)),
    h("div", { class: "meta" },
      h("b", null, ob.type), " · ", ob.ruleset || "", " · ",
      ob.creation, " · ", ob.action),
    ob.desc ? h("div", { class: "meta" }, ob.desc) : null));
  for (const [an, at] of Object.entries(ob.attrs)) {
    card.append(h("div", { class: "rowline", onclick: () => go({ v: "trace", o: oid, a: an }) },
      stateChip(at.state),
      h("span", { class: "name" }, an),
      h("span", { class: "val" }, shortVal(at.value, 90))));
  }
  view.append(card);
}

/* ------------------------------------------------------- search UI */
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
let sel = -1, hits = [];
function showResults() {
  hits = doSearch(searchEl.value); sel = -1;
  resultsEl.replaceChildren();
  if (!hits.length) { resultsEl.style.display = "none"; return; }
  hits.forEach((e, i) => {
    resultsEl.append(h("div", { class: "r", "data-i": i,
      onclick: () => pick(e) },
      e.a ? stateChip(getAttr(e.o, e.a).state) : h("span", { class: "chip other" }, "OBJECT"),
      h("span", { class: "name" }, e.label),
      h("span", { class: "sub" }, e.sub)));
  });
  resultsEl.style.display = "block";
}
function pick(e) {
  resultsEl.style.display = "none"; searchEl.blur();
  go(e.a ? { v: "trace", o: e.o, a: e.a } : { v: "obj", o: e.o });
}
searchEl.addEventListener("input", showResults);
searchEl.addEventListener("focus", () => { if (searchEl.value) showResults(); });
searchEl.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { resultsEl.style.display = "none"; searchEl.blur(); }
  else if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    sel = Math.max(0, Math.min(hits.length - 1, sel + (ev.key === "ArrowDown" ? 1 : -1)));
    [...resultsEl.children].forEach((c, i) => c.classList.toggle("sel", i === sel));
    resultsEl.children[sel] && resultsEl.children[sel].scrollIntoView({ block: "nearest" });
  } else if (ev.key === "Enter" && sel >= 0) pick(hits[sel]);
  else if (ev.key === "Enter" && hits.length) pick(hits[0]);
});
document.addEventListener("keydown", ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") {
    ev.preventDefault(); searchEl.focus(); searchEl.select();
  }
});
document.addEventListener("click", ev => {
  if (!document.getElementById("searchWrap").contains(ev.target))
    resultsEl.style.display = "none";
});
document.getElementById("asof").value =
  asOf.getFullYear() + "-" + String(asOf.getMonth() + 1).padStart(2, "0") +
  "-" + String(asOf.getDate()).padStart(2, "0");
document.getElementById("asof").addEventListener("change", ev => {
  asOf = ev.target.value ? new Date(ev.target.value + "T00:00:00") : null;
  render(current);
});

go(parseHash(location.hash), true);
window.addEventListener("hashchange", () => {
  const loc = parseHash(location.hash);
  if (locHash(loc) !== locHash(current)) go(loc);
});
</script>
