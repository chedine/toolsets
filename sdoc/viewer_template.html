<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CER Trace Explorer</title>
<style>
  :root {
    --surface: #fcfcfb;
    --plane: #f9f9f7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;          /* SPECIFIED / links */
    --accent-soft: rgba(42, 120, 214, 0.10);
    --error: #d03b3b;           /* ERROR */
    --error-soft: rgba(208, 59, 59, 0.09);
    --calc: #898781;            /* CALCULATED chip ink */
    --calc-soft: rgba(11, 11, 11, 0.05);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --plane: #0d0d0d;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --hairline: #2c2c2a; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16);
      --error: #e66767; --error-soft: rgba(230,103,103,0.13);
      --calc: #898781; --calc-soft: rgba(255,255,255,0.06);
    }
  }
  :root[data-theme="light"] {
    --surface: #fcfcfb; --plane: #f9f9f7;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --hairline: #e1e0d9; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-soft: rgba(42,120,214,0.10);
    --error: #d03b3b; --error-soft: rgba(208,59,59,0.09);
    --calc: #898781; --calc-soft: rgba(11,11,11,0.05);
  }
  :root[data-theme="dark"] {
    --surface: #1a1a19; --plane: #0d0d0d;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --hairline: #2c2c2a; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16);
    --error: #e66767; --error-soft: rgba(230,103,103,0.13);
    --calc: #898781; --calc-soft: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 var(--sans);
    background: var(--plane); color: var(--ink);
    display: flex; flex-direction: column;
  }
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: var(--surface);
    border-bottom: 1px solid var(--hairline); flex: none;
  }
  #topbar .brand { font-weight: 650; font-size: 14px; white-space: nowrap; }
  #topbar .brand .dim { color: var(--muted); font-weight: 400; }
  #backBtn {
    border: 1px solid var(--border); background: none; color: var(--ink-2);
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit;
  }
  #backBtn:disabled { opacity: .35; cursor: default; }
  #searchWrap { position: relative; flex: 1; max-width: 560px; }
  #search {
    width: 100%; padding: 6px 10px; font: inherit;
    border: 1px solid var(--hairline); border-radius: 8px;
    background: var(--plane); color: var(--ink); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #searchHint {
    position: absolute; right: 8px; top: 6px; color: var(--muted);
    font-size: 11px; pointer-events: none;
  }
  #results {
    position: absolute; top: 34px; left: 0; right: 0; z-index: 30;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.14);
    max-height: 60vh; overflow-y: auto; display: none;
  }
  #results .r {
    padding: 7px 12px; cursor: pointer; display: flex; gap: 8px;
    align-items: baseline; border-bottom: 1px solid var(--hairline);
  }
  #results .r:last-child { border-bottom: 0; }
  #results .r:hover, #results .r.sel { background: var(--accent-soft); }
  #results .r .name { font-weight: 600; }
  #results .r .sub {
    color: var(--muted); font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  #asofWrap { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
  #asof {
    font: inherit; padding: 3px 6px; border: 1px solid var(--hairline);
    border-radius: 6px; background: var(--plane); color: var(--ink);
  }
  #main { flex: 1; overflow-y: auto; padding: 18px 20px 60px; }
  .wrap { max-width: 1100px; margin: 0 auto; }

  /* chips */
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 650; letter-spacing: .04em;
    padding: 1px 7px; border-radius: 999px; flex: none;
  }
  .chip.CALCULATED { color: var(--calc); background: var(--calc-soft); }
  .chip.SPECIFIED { color: var(--accent); background: var(--accent-soft); }
  .chip.ERROR { color: var(--error); background: var(--error-soft); }
  .chip.other { color: var(--ink-2); background: var(--calc-soft); }

  /* home */
  .tiles { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0 22px; }
  .tile {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 12px 18px; min-width: 130px;
  }
  .tile .v { font-size: 26px; font-weight: 650; }
  .tile .k { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tile.err .v { color: var(--error); }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
           color: var(--muted); font-weight: 650; margin: 26px 0 8px; }
  .card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; overflow: hidden;
  }
  .rowline {
    display: flex; gap: 10px; align-items: baseline; padding: 8px 14px;
    border-bottom: 1px solid var(--hairline); cursor: pointer;
  }
  .rowline:last-child { border-bottom: 0; }
  .rowline:hover { background: var(--accent-soft); }
  .rowline .name { font-weight: 600; white-space: nowrap; }
  .rowline .sub { color: var(--muted); font-size: 12px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .rowline .cnt { color: var(--muted); font-size: 12px; }
  .rowline .val { font-family: var(--mono); font-size: 12px; color: var(--ink-2);
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* object view */
  .objhead { padding: 14px 16px; border-bottom: 1px solid var(--hairline); }
  .objhead .desc { font-size: 17px; font-weight: 650; }
  .objhead .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .objhead .meta b { color: var(--ink-2); font-weight: 550; }

  /* breadcrumb trail */
  #crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
            margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
  #crumbs .c { color: var(--accent); cursor: pointer; padding: 2px 6px;
               border-radius: 6px; max-width: 30ch; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #crumbs .c:hover { background: var(--accent-soft); }
  #crumbs .c.here { color: var(--ink); font-weight: 650; cursor: default; }
  #crumbs .c.here:hover { background: none; }

  /* focus card */
  .focus { background: var(--surface); border: 1px solid var(--hairline);
           border-radius: 14px; overflow: hidden; }
  .fhead { padding: 16px 20px 14px; border-bottom: 1px solid var(--hairline); }
  .fhead .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fhead .aname { font-size: 20px; font-weight: 700; }
  .fhead .objlink { color: var(--muted); font-size: 12.5px; cursor: pointer;
                    margin-left: auto; max-width: 44ch; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
  .fhead .objlink:hover { color: var(--accent); }
  .fhead .dtype { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .fval { padding: 14px 20px; border-bottom: 1px solid var(--hairline); }
  .fval .lbl, .fbody .lbl, .fdeps .lbl {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 650; margin-bottom: 6px; }
  .fval .v { font-family: var(--mono); font-size: 16px; word-break: break-word; }
  .fval .v.err { color: var(--error); }
  .fbody { padding: 14px 20px; }
  .fbody .deriv { font-size: 13.5px; color: var(--ink-2); line-height: 1.75;
                  overflow-x: auto; }
  .fbody .deriv ul { margin: 2px 0; padding-left: 20px; }
  .fbody .deriv li { list-style: none; position: relative; }
  .fbody .deriv li::before { content: ""; position: absolute; left: -12px; top: 0.85em;
                             width: 6px; height: 1px; background: var(--hairline); }
  .tok {
    color: var(--accent); cursor: pointer; font-family: var(--mono);
    font-size: 12.5px; background: var(--accent-soft);
    border-radius: 5px; padding: 0 4px;
  }
  .tok:hover { text-decoration: underline; }
  .tok.err { color: var(--error); background: var(--error-soft); }
  .tokval { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  /* inline-block: baseline = the token line, so neighbors stay aligned
     while the probe value floats above */
  .tokwrap { display: inline-block; margin: 0 2px; }
  .tokv { display: block; font: 9.5px/1.3 var(--mono); color: var(--muted);
          padding-left: 4px; max-width: 30ch; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; user-select: none; }
  .tokv.err { color: var(--error); }

  /* decision tables inside fx */
  .dtbl { margin: 6px 0; display: flex; flex-direction: column; gap: 8px; }
  .dtrow { border: 1px solid var(--hairline); border-left: 3px solid var(--accent);
           border-radius: 8px; padding: 8px 12px; background: var(--plane); }
  .dtcell { margin: 2px 0; }
  .dtcell .dtlbl { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--muted); font-weight: 700; }
  .dtcell > ul { margin: 2px 0 4px !important; padding-left: 4px !important; }

  /* rule-object value block */
  .refblock { margin-top: 4px; }
  .refhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .refhead .tok { font-size: 14px; padding: 1px 7px; }
  .refdesc { color: var(--muted); font-size: 12px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
  .miniattrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
               gap: 6px; }
  .mini { display: flex; align-items: baseline; gap: 7px; padding: 5px 10px;
          border: 1px solid var(--hairline); border-radius: 9px; cursor: pointer;
          overflow: hidden; }
  .mini:hover { background: var(--accent-soft); border-color: var(--accent); }
  .mini .dot { align-self: center; }
  .mini .name { font-weight: 600; font-size: 12px; white-space: nowrap; }
  .mini .val { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
  .fdeps { padding: 12px 20px 16px; border-top: 1px solid var(--hairline); }
  .fdeps .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                 gap: 6px; }
  .dep {
    display: flex; align-items: baseline; gap: 7px; padding: 6px 10px;
    border: 1px solid var(--hairline); border-radius: 9px; cursor: pointer;
    overflow: hidden;
  }
  .dep:hover { background: var(--accent-soft); border-color: var(--accent); }
  .dep .dot { width: 8px; height: 8px; border-radius: 50%; flex: none;
              align-self: center; }
  .dot.CALCULATED { background: var(--calc); }
  .dot.SPECIFIED { background: var(--accent); }
  .dot.ERROR { background: var(--error); }
  .dep .name { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .dep .val { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              flex: 1; min-width: 0; }
  .usedby-toggle { background: none; border: none; color: var(--accent);
                   cursor: pointer; font: inherit; font-size: 12.5px; padding: 0; }
  .usedby-toggle:hover { text-decoration: underline; }

  /* timeline table */
  .tltable { margin-top: 8px; border-collapse: collapse; font: 12.5px var(--mono); }
  .tltable td, .tltable th { border: 1px solid var(--hairline); padding: 3px 10px; text-align: left; }
  .tltable th { font-family: var(--sans); color: var(--muted); font-weight: 600; }
  .tltable tr.hit { background: var(--accent-soft); }
  .tlwrap { overflow-x: auto; }
  .tlchip { color: var(--accent); background: var(--accent-soft);
            border-radius: 999px; padding: 0 7px; font: 650 10.5px var(--sans);
            cursor: pointer; border: none; vertical-align: 1px; }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  a.plain { color: var(--accent); cursor: pointer; text-decoration: none; }
  a.plain:hover { text-decoration: underline; }

  /* ------------------------------------------------ graph view */
  .gtoolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
              font-size: 12.5px; color: var(--ink-2); }
  .gtoolbar select { font: inherit; padding: 2px 6px; border: 1px solid var(--hairline);
                     border-radius: 6px; background: var(--surface); color: var(--ink); }
  .gtoolbar .btn { border: 1px solid var(--hairline); background: var(--surface);
                   color: var(--ink-2); border-radius: 6px; padding: 3px 10px;
                   cursor: pointer; font: inherit; font-size: 12.5px; }
  .gtoolbar .btn:hover { border-color: var(--accent); color: var(--accent); }
  .gtoolbar .hint { color: var(--muted); margin-left: auto; }
  .gdirs { display: inline-flex; border: 1px solid var(--hairline); border-radius: 6px;
    overflow: hidden; }
  .gdir { border: none; background: var(--surface); color: var(--muted);
    padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .gdir + .gdir { border-left: 1px solid var(--hairline); }
  .gdir.on { background: var(--accent); color: #fff; }
  .gdir:not(.on):hover { color: var(--accent); }
  /* timeline lanes */
  .lanes { border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface);
    position: relative; overflow: hidden; cursor: crosshair; }
  .lrow { display: flex; align-items: stretch; border-top: 1px solid var(--hairline);
    min-height: 34px; }
  .lrow.root { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .lrow.laxis { border-top: none; min-height: 24px; }
  .llabel { width: 230px; flex: none; padding: 4px 8px 4px 10px; cursor: pointer;
    overflow: hidden; border-right: 1px solid var(--hairline); }
  .llabel .ln { font-size: 12px; font-weight: 600; white-space: nowrap;
    text-overflow: ellipsis; overflow: hidden; }
  .llabel:hover .ln { color: var(--accent); }
  .llabel .lo { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .ltrack { flex: 1; position: relative; overflow: hidden; }
  .lcurcol { width: 118px; flex: none; padding: 8px 10px 0 8px; font: 11px var(--mono);
    text-align: right; border-left: 1px solid var(--hairline); white-space: nowrap;
    overflow: hidden; }
  .ltick { position: absolute; top: 5px; transform: translateX(-50%); font-size: 10px;
    color: var(--muted); }
  .lgrid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hairline);
    opacity: .5; }
  .lseg { position: absolute; top: 50%; transform: translateY(-50%); height: 20px;
    border-radius: 4px; background: color-mix(in srgb, var(--c) 24%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 60%, transparent);
    font: 10.5px/18px var(--mono); padding: 0 5px; overflow: hidden;
    white-space: nowrap; box-sizing: border-box; }
  .lseg.off { background: none; color: var(--muted); }
  .lflat { position: absolute; inset: 0; font: 10.5px/34px var(--mono);
    color: var(--muted); padding: 0 6px; }
  .loverlay { position: absolute; left: 231px; right: 119px; top: 24px; bottom: 0;
    pointer-events: none; }
  .lmark { position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 1px dashed var(--accent); opacity: .55; }
  .lcursor { position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 1px solid var(--ink); opacity: .6; }
  /* what-if */
  .wibar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px;
    margin: 10px 14px 0; font-size: 12px;
    background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .wibar .sub { color: var(--muted); font-size: 11px; }
  .wiov { font: 11px var(--mono); }
  .wix { border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 11px; }
  .wix:hover { color: var(--error); }
  .wipencil { border: 1px solid var(--hairline); border-radius: 5px;
    background: var(--surface); color: var(--accent); cursor: pointer;
    font-size: 11px; line-height: 1.4; flex: none; padding: 0 5px;
    align-self: center; }
  .wipencil:hover { border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .wichip { font: 10px var(--mono); padding: 1px 6px; border-radius: 8px; flex: none; }
  .wichip.ov { background: var(--accent); color: #fff; }
  .wichip.now { border: 1px solid var(--accent); color: var(--accent); }
  .wichip.stale { border: 1px solid #eda100; color: #b97f00; }
  .winote { margin-top: 8px; font: 12px var(--mono); padding: 6px 10px;
    border-radius: 6px; width: fit-content; }
  .winote.now { border: 1px solid var(--accent); color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .winote.same { color: var(--muted); border: 1px dashed var(--hairline); }
  .winote.stale { border: 1px solid #eda100; color: #b97f00; }
  .wiinput { font: 12px var(--mono); padding: 2px 6px; border: 1px solid var(--accent);
    border-radius: 5px; background: var(--surface); color: var(--ink); width: 150px; }
  .wibtn { border: 1px solid var(--hairline); background: none; color: var(--accent);
    border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit;
    font-size: 11px; flex: none; }
  .gwrap { position: relative; height: calc(100vh - 150px); overflow: hidden;
           background: var(--surface); border: 1px solid var(--hairline);
           border-radius: 14px; cursor: grab; }
  .gwrap.panning { cursor: grabbing; }
  .gcanvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .gcanvas svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .gedge { fill: none; stroke: var(--hairline); stroke-width: 1.4; }
  .gedge.hl { stroke: var(--accent); stroke-width: 2; }
  .gnode { position: absolute; width: 210px; padding: 6px 10px 7px 12px;
           background: var(--plane); border: 1px solid var(--hairline);
           border-left: 3px solid var(--calc); border-radius: 9px;
           cursor: pointer; user-select: none; }
  .gnode:hover { border-color: var(--accent); }
  .gnode.SPECIFIED { border-left-color: var(--accent); }
  .gnode.ERROR { border-left-color: var(--error); }
  .gnode.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .gnode .gv { font: 10px/1.3 var(--mono); color: var(--muted); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .gnode.ERROR .gv { color: var(--error); }
  .gnode .gn { font-weight: 650; font-size: 12.5px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .gnode .go { font-size: 10.5px; color: var(--muted); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .gnode .gmore { position: absolute; right: 6px; top: 6px; font-size: 10px;
                  color: var(--muted); background: var(--calc-soft);
                  border-radius: 999px; padding: 0 6px; }
  .gpanel { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 400px;
            background: var(--surface); border: 1px solid var(--hairline);
            border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.16);
            overflow-y: auto; padding: 14px 16px; cursor: auto; }
  .gpanel .aname { font-size: 16px; font-weight: 700; }
  .gpanel .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
                 color: var(--muted); font-weight: 650; margin: 12px 0 4px; }
  .gpanel .deriv { font-size: 12.5px; color: var(--ink-2); line-height: 1.7;
                   overflow-x: auto; }
  .gpanel .deriv ul { margin: 2px 0; padding-left: 16px; }
  .gpanel .deriv li { list-style: none; }
  .gpanel .v { font-family: var(--mono); font-size: 13px; word-break: break-word; }
  .gpanel .row { display: flex; gap: 8px; align-items: center; margin-top: 4px;
                 flex-wrap: wrap; }
  .gpanel .close { position: absolute; right: 10px; top: 8px; border: none;
                   background: none; color: var(--muted); font-size: 16px;
                   cursor: pointer; }
  .gpanel .close:hover { color: var(--ink); }
</style>

<div id="topbar">
  <span class="brand">CER <span class="dim">trace explorer</span></span>
  <button id="backBtn" title="Back">&#8592;</button>
  <div id="searchWrap">
    <input id="search" type="text" placeholder="Search objects &amp; attributes&hellip;" autocomplete="off">
    <span id="searchHint">&#8984;K</span>
    <div id="results"></div>
  </div>
  <span id="asofWrap">as of <input id="asof" type="date" title="Collapse timeline values to this date"></span>
</div>
<div id="main"><div class="wrap" id="view"></div></div>

<script>
"use strict";
const DATA = /*__DATA__*/null;

/* ---------------------------------------------------------- helpers */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k == null) continue;
    el.append(k.nodeType ? k : document.createTextNode(k));
  }
  return el;
}
const key = (o, a) => o + " " + a;
const getAttr = (o, a) => (DATA.objects[o] || { attrs: {} }).attrs[a];
const objDesc = o => {
  const ob = DATA.objects[o];
  if (!ob) return o;
  return ob.desc || ob.type || o;
};
/* devs navigate by rule class (Type), not by description */
const shortType = o => {
  const ob = DATA.objects[o];
  if (!ob || !ob.type) return o;
  const t = ob.type;
  return t.includes(".") ? t.slice(t.lastIndexOf(".") + 1) : t;
};
const objLabel = o => shortType(o) + (String(o).length <= 8 ? " · " + o : "");
function stateChip(st) {
  const cls = ["CALCULATED", "SPECIFIED", "ERROR"].includes(st) ? st : "other";
  const label = st === "ERROR" ? "⚠ ERROR" : (st || "—");
  return h("span", { class: "chip " + cls }, label);
}

/* ------------------------------------------------- derived indexes */
const usedBy = {};           // key -> [[obj, attr], ...]
const errAttrs = [];         // [[obj, attr], ...]
for (const [oid, ob] of Object.entries(DATA.objects)) {
  for (const [an, at] of Object.entries(ob.attrs)) {
    if (at.state === "ERROR") errAttrs.push([oid, an]);
    for (const [dO, dA] of at.deps) {
      (usedBy[key(dO, dA)] ||= []).push([oid, an]);
    }
  }
}
const errRoots = errAttrs.filter(([o, a]) => {
  const at = getAttr(o, a);
  return !at.deps.some(([dO, dA]) => {
    const d = getAttr(dO, dA);
    return d && d.state === "ERROR" && !(dO === o && dA === a);
  });
});

/* search index */
const sidx = [];
for (const [oid, ob] of Object.entries(DATA.objects)) {
  // label by rule class; description stays searchable via hay and shown as sub
  sidx.push({ o: oid, a: null, label: objLabel(oid),
              sub: ob.desc || ob.type,
              hay: ((ob.desc || "") + " " + ob.type + " " + oid).toLowerCase() });
  for (const an of Object.keys(ob.attrs)) {
    sidx.push({ o: oid, a: an, label: an, sub: objLabel(oid) + " — " + (ob.desc || ""),
                hay: (an + " " + (ob.desc || "") + " " + ob.type).toLowerCase() });
  }
}
function doSearch(q) {
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  for (const e of sidx) {
    let score = 0, ok = true;
    for (const t of toks) {
      const i = e.hay.indexOf(t);
      if (i < 0) { ok = false; break; }
      score += (e.label.toLowerCase().startsWith(t) ? 100 : 0) +
               (i === 0 || e.hay[i - 1] === " " ? 30 : 0) - i * 0.01;
    }
    if (ok) { out.push([score + (e.a ? 5 : 0), e]); }
  }
  out.sort((x, y) => y[0] - x[0]);
  return out.slice(0, 50).map(x => x[1]);
}

/* ------------------------------------------------- timeline values */
function parseDate(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s.trim());
  return m ? new Date(+m[3], +m[1] - 1, +m[2]) : null;
}
function tlValueAt(tl, when) {
  for (const [from, to, v] of tl) {
    const f = parseDate(from), t = parseDate(to);
    if ((f === null || f <= when) && (t === null || when <= t)) return v;
  }
  return null;
}
let asOf = new Date();
asOf.setHours(0, 0, 0, 0);

function isTL(val) { return val && typeof val === "object" && val.tl; }
const isRef = val => val && typeof val === "object" && val.ref;
const isRefList = val => val && typeof val === "object" && val.list;
function shortVal(val, max) {
  max = max || 36;
  let s;
  if (isRef(val)) s = "→ " + shortType(val.ref);
  else if (isRefList(val)) s = "List (" + val.list.length + " objects)";
  else if (isTL(val)) {
    if (asOf) {
      const v = tlValueAt(val.tl, asOf);
      s = v === null ? "(no interval)" : v;
    } else {
      const vs = [...new Set(val.tl.map(r => r[2]))];
      s = vs.length === 1 ? vs[0] : vs.join(" → ");
    }
  } else s = String(val ?? "");
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}
function tlTable(tl) {
  return h("div", { class: "tlwrap" },
    h("table", { class: "tltable" },
      h("tr", null, h("th", null, "From"), h("th", null, "To"), h("th", null, "Value")),
      tl.map(([f, t, v]) => {
        const hit = asOf && tlValueAt([[f, t, v]], asOf) !== null;
        return h("tr", { class: hit ? "hit" : "" },
          h("td", null, f), h("td", null, t), h("td", null, v));
      })));
}

/* ------------------------------------------------- derivation (fx) */
const IDENT_RE = /[A-Za-z_][A-Za-z0-9_]*/g;

function tokenEl(name, ref) {
  const at = getAttr(ref[0], ref[1]);
  const err = at && at.state === "ERROR";
  const tok = h("span", {
    class: "tok" + (err ? " err" : ""),
    title: objLabel(ref[0]) + (at ? " = " + shortVal(at.value, 60) : ""),
    onclick: () => go({ v: "trace", o: ref[0], a: ref[1], ext: 1 }) }, name);
  if (!at) return tok;
  // live-probe style: the current value floats just above the token
  let sv = isRef(at.value) || isRefList(at.value) ? "" : shortVal(at.value, 26);
  if (/^Undescribed instance/.test(sv)) sv = "";
  return h("span", { class: "tokwrap" },
    h("span", { class: "tokv" + (err ? " err" : "") }, sv || " "),
    tok);
}

function linkifyText(text, depMap) {
  const frag = document.createDocumentFragment();
  let last = 0, m;
  IDENT_RE.lastIndex = 0;
  while ((m = IDENT_RE.exec(text))) {
    const ref = depMap[m[0]];
    if (!ref) continue;
    frag.append(text.slice(last, m.index));
    frag.append(tokenEl(m[0], ref));
    last = m.index + m[0].length;
  }
  frag.append(text.slice(last));
  return frag;
}

function renderDerivTable(tbl, depMap) {
  const hs = tbl.h.length ? tbl.h : ["If", "Then"];
  const box = h("div", { class: "dtbl" });
  for (const row of tbl.rows) {
    const r = h("div", { class: "dtrow" });
    row.forEach((cell, i) => {
      r.append(h("div", { class: "dtcell" },
        h("div", { class: "dtlbl" }, (hs[i] || "…").toLowerCase()),
        renderDeriv(cell, depMap)));
    });
    box.append(r);
  }
  return box;
}

function renderDeriv(items, depMap) {
  const ul = h("ul");
  for (const it of items) {
    const li = h("li");
    if (it.tbl) { li.append(renderDerivTable(it.tbl, depMap)); ul.append(li); continue; }
    if (it.ref) li.append(tokenEl(it.t, it.ref));
    else if (it.t) li.append(linkifyText(it.t, depMap));
    if (it.c && it.c.length) li.append(renderDeriv(it.c, depMap));
    ul.append(li);
  }
  return ul;
}

/* ------------------------------------------------- focus card view */
let trail = [];   // breadcrumb path of (o, a) walked within one investigation

function renderFocus(oid, an) {
  const at = getAttr(oid, an);
  if (!at) {
    view.append(h("div", { class: "empty" }, an + " — not found in dump (" + oid + ")"));
    return;
  }

  /* breadcrumb */
  const crumbs = h("div", { id: "crumbs" });
  trail.forEach((t, i) => {
    if (i) crumbs.append(h("span", null, "›"));
    const here = i === trail.length - 1;
    crumbs.append(h("span", { class: "c" + (here ? " here" : ""), title: objDesc(t.o),
      onclick: here ? null : () => go({ v: "trace", o: t.o, a: t.a, ext: 1 }) }, t.a));
  });
  if (trail.length > 1) view.append(crumbs);

  /* dep name -> ref map for linkifying derivation text */
  const depMap = {};
  for (const [dO, dA] of at.deps) if (!depMap[dA]) depMap[dA] = [dO, dA];

  const card = h("div", { class: "focus" });

  /* header */
  card.append(h("div", { class: "fhead" },
    h("div", { class: "top" },
      h("span", { class: "aname" }, an),
      stateChip(at.state),
      h("button", { class: "usedby-toggle", title: "switch to graph view",
        onclick: () => go({ v: "graph", o: oid, a: an }) }, "⊞ graph"),
      h("button", { class: "usedby-toggle", title: "timeline lanes — inputs over time",
        onclick: () => go({ v: "lanes", o: oid, a: an }) }, "⧗ lanes"),
      h("span", { class: "objlink", title: objDesc(oid),
        onclick: () => go({ v: "obj", o: oid }) }, objLabel(oid))),
    h("div", { class: "dtype" }, at.type || "")));

  /* what-if: shared eval context for this render, banner when active */
  const wiCtx = wiOverrides.size ? WI.newCtx(wiWhen(), wiOverrides) : null;
  if (wiCtx) {
    card.append(h("div", { class: "wibar" },
      h("b", null, "⚗ what-if"),
      h("span", { class: "sub" }, "at " + wiCtx.when.toLocaleDateString()),
      [...wiOverrides].map(([k, v]) => {
        const o2 = k.slice(0, k.indexOf(" ")), a2 = k.slice(k.indexOf(" ") + 1);
        return h("span", { class: "wiov" },
          h("a", { class: "plain", onclick: () => go({ v: "trace", o: o2, a: a2, ext: 1 }) }, a2),
          " := " + v + " ",
          h("button", { class: "wix", title: "remove override",
            onclick: () => { wiOverrides.delete(k); render(current); } }, "✕"));
      }),
      h("button", { class: "wibtn", onclick: () => { wiOverrides.clear(); render(current); } },
        "clear all")));
  }

  /* value */
  const fval = h("div", { class: "fval" });
  fval.append(h("div", { class: "lbl" }, asOf && isTL(at.value)
    ? "value as of " + asOf.toLocaleDateString() : "value"));
  if (isRef(at.value)) {
    fval.append(objRefBlock(at.value.ref, at.value.t));
  } else if (isRefList(at.value)) {
    fval.append(h("div", { class: "v" }, "List · " + at.value.list.length + " objects"));
    for (const [rid, t] of at.value.list) fval.append(objRefBlock(rid, t));
  } else {
    fval.append(h("div", { class: "v" + (at.state === "ERROR" ? " err" : "") },
      shortVal(at.value, 400)));
    if (isTL(at.value)) {
      const tbl = tlTable(at.value.tl);
      if (at.value.tl.length > 12) {
        tbl.style.display = "none";
        fval.append(h("div", null, h("button", { class: "tlchip",
          onclick: e => { tbl.style.display = tbl.style.display === "none" ? "" : "none"; } },
          "timeline · " + at.value.tl.length + " intervals")), tbl);
      } else fval.append(tbl);
    }
  }
  if (wiCtx) {
    const res = WI.evalAttr(oid, an, wiCtx);
    const base = WI.scalarize(at.value, wiCtx.when);
    const rv = res.v ?? "null", bv = base ?? "null";
    if (!res.known && res.tainted)
      fval.append(h("div", { class: "winote stale" },
        "⚗ what-if: unknown — an override flows through a step the interpreter can't evaluate"));
    else if (res.known && res.tainted)
      fval.append(h("div", { class: "winote " + (String(rv) !== String(bv) ? "now" : "same") },
        String(rv) !== String(bv)
          ? "⚗ what-if: " + rv + "   (session: " + bv + ")"
          : "⚗ what-if: " + rv + " — unchanged"));
  }
  card.append(fval);

  /* inputs (deps) — above the fx so values are read top-down */
  if (at.deps.length) {
    const finputs = h("div", { class: "fdeps" });
    finputs.append(h("div", { class: "lbl" }, "inputs (" + at.deps.length + ")"));
    const grid = h("div", { class: "grid" });
    for (const [dO, dA] of at.deps) {
      const dAt = getAttr(dO, dA);
      const row = h("div", { class: "dep", title: objLabel(dO) },
        h("span", { class: "dot " + (dAt ? dAt.state : "") }),
        h("span", { class: "name" }, dA),
        h("span", { class: "val" }, dAt ? shortVal(dAt.value, 40) : "?"),
        wiChip(dO, dA, wiCtx),
        h("button", { class: "wipencil", title: "what-if: override this value",
          onclick: ev => { ev.stopPropagation(); wiEdit(row, dO, dA); } }, "✎"));
      row.addEventListener("click", () => {
        if (!row.dataset.editing) go({ v: "trace", o: dO, a: dA, ext: 1 });
      });
      grid.append(row);
    }
    finputs.append(grid);
    card.append(finputs);
  }

  /* fx */
  card.append(h("div", { class: "fbody" },
    h("div", { class: "lbl" }, "ƒx — how this value is computed"),
    h("div", { class: "deriv" },
      at.deriv.length ? renderDeriv(at.deriv, depMap)
                      : h("i", null, "No derivation recorded — " +
                          (at.state === "SPECIFIED" ? "specified externally." : "n/a.")))));

  /* used by: first three visible, the rest behind a link */
  const ubList = usedBy[key(oid, an)] || [];
  if (ubList.length) {
    const fub = h("div", { class: "fdeps" });
    fub.append(h("div", { class: "lbl" },
      "↑ used by " + ubList.length + " attribute" + (ubList.length > 1 ? "s" : "")));
    const panel = h("div", { class: "card", style: "margin-top:2px" });
    const row = ([uO, uA]) => {
      const uAt = getAttr(uO, uA);
      return h("div", { class: "rowline",
        onclick: () => go({ v: "trace", o: uO, a: uA, ext: 1 }) },
        stateChip(uAt ? uAt.state : ""), h("span", { class: "name" }, uA),
        h("span", { class: "sub" }, objLabel(uO)));
    };
    for (const e of ubList.slice(0, 3)) panel.append(row(e));
    if (ubList.length > 3) {
      const moreRow = h("div", { class: "rowline" },
        h("a", { class: "plain" }, "show " + (ubList.length - 3) + " more →"));
      moreRow.addEventListener("click", () => {
        moreRow.remove();
        for (const e of ubList.slice(3)) panel.append(row(e));
      });
      panel.append(moreRow);
    }
    fub.append(panel);
    card.append(fub);
  }
  view.append(card);
}

/* a rule-object value: clickable, and inlined when the object is small */
function objRefBlock(rid, label) {
  const ob = DATA.objects[rid];
  const box = h("div", { class: "refblock" });
  box.append(h("div", { class: "refhead" },
    h("span", { class: "tok", onclick: () => go({ v: "obj", o: rid }) },
      shortType(rid)),
    h("span", { class: "refdesc" }, label || objDesc(rid))));
  if (ob) {
    const names = Object.keys(ob.attrs).filter(a => a !== "description");
    if (names.length <= 8) {
      const mini = h("div", { class: "miniattrs" });
      for (const a2 of names) {
        const at2 = ob.attrs[a2];
        mini.append(h("div", { class: "mini",
          onclick: () => go({ v: "trace", o: rid, a: a2, ext: 1 }) },
          h("span", { class: "dot " + at2.state }),
          h("span", { class: "name" }, a2),
          h("span", { class: "val" }, shortVal(at2.value, 44))));
      }
      box.append(mini);
    }
  }
  return box;
}

/* ====================================================================
   what-if interpreter (modular)

   A rough evaluator over parsed derivation trees. It works on SCALARS
   AT A POINT IN TIME: timeline values collapse via tlValueAt(asOf), so
   boolean/comparison logic needs no interval algebra. Everything it
   does not recognize is OPAQUE: an opaque attr keeps its dump value
   unless an override taints its inputs, in which case it goes STALE
   (unknown) rather than silently wrong.

   Self-contained: touches the host only through the api object.
   ==================================================================== */
const WI = (api => {
  const { getAttr, key, parseDate, tlValueAt, isTL, isRef, isRefList, objects } = api;
  const OPAQUE = Symbol("opaque");

  const scalarize = (val, when) => {
    if (isTL(val)) return tlValueAt(val.tl, when);
    if (isRef(val) || isRefList(val)) return val;
    return val == null ? null : String(val);
  };
  const num = s => {
    if (s == null || typeof s === "object") return null;
    const n = Number(String(s).replace(/,/g, ""));
    return isNaN(n) ? null : n;
  };
  const known = (v, tainted) => ({ v, known: true, tainted });
  const unknown = tainted => ({ known: false, tainted });
  const txt = it => (it.t || "").trim();
  const meaningful = items =>
    (items || []).filter(it => it.tbl || it.ref || it.c || txt(it) !== "");

  const newCtx = (when, overrides) =>
    ({ when, overrides: overrides || new Map(), memo: new Map(), stack: new Set() });

  function evalAttr(o, a, ctx) {
    const k = key(o, a);
    if (ctx.overrides.has(k))
      return { v: ctx.overrides.get(k), known: true, tainted: true, why: "override" };
    if (ctx.memo.has(k)) return ctx.memo.get(k);
    if (ctx.stack.has(k)) return { ...unknown(false), why: "cycle" };
    const at = getAttr(o, a);
    if (!at) return { ...unknown(false), why: "missing" };
    ctx.stack.add(k);
    let res;
    if (at.state === "SPECIFIED" || !at.deriv.length) {
      res = { ...known(scalarize(at.value, ctx.when), false), why: "leaf" };
    } else if (isIdentityDeriv(at.deriv)) {
      // the value is a constructed object reference (or external constant):
      // its identity never changes under what-if — the instance's attrs
      // re-evaluate through their own derivations
      res = { ...known(scalarize(at.value, ctx.when), false), why: "identity" };
    } else {
      const depMap = {};
      for (const [dO, dA] of at.deps) if (!depMap[dA]) depMap[dA] = [dO, dA];
      const r = evalSeq(at.deriv, { o, depMap, ctx, items: [] });
      if (r === OPAQUE) {
        let tainted = false;
        for (const [dO, dA] of at.deps)
          if (evalAttr(dO, dA, ctx).tainted) { tainted = true; break; }
        const dumpV = scalarize(at.value, ctx.when);
        res = tainted ? { ...unknown(true), why: "stale" }
            : dumpV === "?" ? { ...unknown(false), why: "error" }   // CER never computed it
            : { ...known(dumpV, false), why: "opaque" };
      } else {
        res = { ...r, why: r.known ? "computed" : "stale" };
      }
    }
    ctx.stack.delete(k);
    ctx.memo.set(k, res);
    return res;
  }

  function isIdentityDeriv(deriv) {
    const ms = meaningful(deriv);
    if (ms.length !== 1) return false;
    const t = txt(ms[0]);
    if (/^Create an instance of \w+, setting:?$/.test(t)) return true;
    // rate lookup with fixed coordinates = external constant
    if (/^Get rate from:?$/.test(t))
      return meaningful(ms[0].c).every(x => /^Rate (table|row|column): /.test(txt(x)));
    return false;
  }

  function evalSeq(items, env) {
    const ms = meaningful(items);
    if (!ms.length) return known(null, false);
    if (ms.length === 1) return evalItem(ms[0], env);
    return OPAQUE;
  }

  function evalItem(it, env) {
    if (it.tbl) return evalTable(it.tbl, env);
    if (it.ref) return evalAttr(it.ref[0], it.ref[1], env.ctx);
    const t = txt(it);
    const c = meaningful(it.c);
    if (/^All of:?$/.test(t)) return evalBool(c, env, true);
    if (/^Any of:?$/.test(t)) return evalBool(c, env, false);
    if (/^Not$/.test(t)) {
      const r = evalSeq(c, env);
      if (r === OPAQUE || !r.known) return r;
      if (r.v === "true" || r.v === "false")
        return known(r.v === "true" ? "false" : "true", r.tainted);
      return OPAQUE;
    }
    if (/^Equality check:?$/.test(t)) return evalCompare(c, env);
    if (/^Comparison:?$/.test(t)) return evalCompare(c, env);
    if (/^Arithmetic:?$/.test(t)) return evalArith(c, env);
    // wrappers that are identity at a point in time
    if (/^(Value from an interval in|Get:?$|Create a timeline from values returned|Get code value from code table)/.test(t))
      return evalSeq(c, env);
    const mProp = /^Retrieve the property '([^']+)' from:?$/.exec(t);
    if (mProp) return evalProp(mProp[1], c, env);
    if (/^Create an existence timeline:?$/.test(t)) return evalExistence(c, env);
    if (/^Get a single item .* from ?:?$/.test(t)) {
      const src = c.length === 1 ? evalList(c[0], env) : OPAQUE;
      if (src === OPAQUE || !src.known) return src;
      return known(src.members.length ? { ref: src.members[0] } : null, src.tainted);
    }
    // CER's age function: age bumps on the 1st of the month after the birthday
    if (/^Invoke the Java method \S*\.createAgeTimeline, passing$/.test(t)) {
      const d = evalSeq(c, env);
      if (d === OPAQUE || !d.known) return d;
      const start = d.v && parseDate(String(d.v));
      if (!start) return OPAQUE;
      const w = env.ctx.when;
      let age = w.getFullYear() - start.getFullYear();
      if (w < new Date(w.getFullYear(), start.getMonth() + 1, 1)) age -= 1;
      return known(String(Math.max(age, 0)), d.tainted);
    }
    if (c.length) return OPAQUE;      // unrecognized head with children
    return evalText(t, env);
  }

  /* -------- list machinery: sources, loops, member bindings -------- */
  const typeOf = oid => {
    const ob = objects[oid];
    return ob && ob.type ? ob.type.split(".").pop() : "";
  };
  const listFromVal = v => {
    if (isRefList(v)) return v.list.map(x => x[0]);
    if (isRef(v)) return [v.ref];
    if (v == null) return [];
    if (typeof v === "string" && (/^List: ?\(No entries\.\)$/.test(v) || v === "(No items.)"))
      return [];
    return null;
  };

  // evaluate an item to a LIST of member object ids
  function evalList(it, env) {
    const t = txt(it);
    let c = meaningful(it.c).filter(x => !/^According to the order:?$/.test(txt(x)));
    if (/^(A list containing:?|Join together the lists within:?)$/.test(t)) {
      const out = []; let tainted = false;
      for (const ch of c) {
        const sub = evalList(ch, env);
        if (sub === OPAQUE || !sub.known) return sub;
        tainted = tainted || sub.tainted;
        out.push(...sub.members);
      }
      return { known: true, members: out, tainted };
    }
    if (/^(List:?|Remove duplicates from:?|Get list:?)$/.test(t))
      return c.length === 1 ? evalList(c[0], env)
           : c.length === 2 && /^For each entry in the list:?$/.test(txt(c[0]))
             ? evalListMap(c[0], c[1], env) : OPAQUE;
    if (/^Filter:?$/.test(t) && c.length === 2 &&
        /^For each entry in the list:?$/.test(txt(c[0])) &&
        /^Find all records where:?$/.test(txt(c[1]))) {
      const src = evalLoopSrc(c[0], env);
      if (src === OPAQUE || !src.known) return src;
      const kept = []; let tainted = src.tainted;
      for (const oid of src.members) {
        env.items.push({ oid, type: typeOf(oid), name: src.name });
        const r = evalSeq(meaningful(c[1].c), env);
        env.items.pop();
        if (r === OPAQUE) return OPAQUE;
        tainted = tainted || r.tainted;
        if (!r.known) return { ...unknown(tainted) };
        if (r.v === "true") kept.push(oid);

      }
      return { known: true, members: kept, tainted, name: src.name };
    }
    // plain expression whose value is a (possibly empty) reference list
    const r = evalItem(it, env);
    if (r === OPAQUE || !r.known) return r;
    const ms = listFromVal(r.v);
    if (ms === null) return OPAQUE;
    const ident = /^[A-Za-z_]\w*$/.test(t) ? t : undefined;

  const evalLoopSrc = (forEachItem, env) => {
    const c = meaningful(forEachItem.c);
    return c.length === 1 ? evalList(c[0], env) : OPAQUE;

  // "For each ... / Get:" producing a list of members (map that yields refs)
  function evalListMap(loopIt, getIt, env) {
    const src = evalLoopSrc(loopIt, env);
    if (src === OPAQUE || !src.known) return src;
    const out = []; let tainted = src.tainted;
    for (const oid of src.members) {
      env.items.push({ oid, type: typeOf(oid), name: src.name });
      const r = evalSeq(meaningful(getIt.c), env);
      env.items.pop();
      if (r === OPAQUE) return OPAQUE;
      tainted = tainted || r.tainted;
      if (!r.known) return { ...unknown(tainted) };

  function evalText(t, env) {
    if (t === "true" || t === "false") return known(t, false);
    if (t === "null") return known(null, false);
    if (/^-?\d[\d,]*(\.\d+)?$/.test(t)) return known(t, false);
    const q = /^"(.*)"$/.exec(t) || /^'(.*)'$/.exec(t);
    if (q) return known(q[1], false);
    if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(t)) return known(t, false);
    // identifier or dotted path rooted at a dependency of this attr
    const path = /^[A-Za-z_]\w*(\.[A-Za-z_]\w*)*$/.test(t) ? t.split(".") : null;
    if (path && env.depMap[path[0]]) {
      let cur = evalAttr(...env.depMap[path[0]], env.ctx);
      for (const seg of path.slice(1)) {
        if (!cur.known) return cur;
        if (!isRef(cur.v)) return OPAQUE;
        const next = evalAttr(cur.v.ref, seg, env.ctx);
        cur = { ...next, tainted: next.tainted || cur.tainted };
      }
      return cur;
    }
    // member reference inside a list loop: (List item[ name]: Type).path
    const li = /^\(List item(?: (\w+))?: (\w+)\)((?:\.\w+)+)$/.exec(t);
    if (li) {
      const bind = [...env.items].reverse().find(b =>
        li[1] ? (b.name === li[1] || (!b.name && b.type === li[2])) : b.type === li[2]);
      if (!bind) return OPAQUE;
      let cur = known({ ref: bind.oid }, false);
      for (const seg of li[3].slice(1).split(".")) {
        if (!cur.known) return cur;
        if (!isRef(cur.v)) return OPAQUE;
        const next = evalAttr(cur.v.ref, seg, env.ctx);
        cur = { ...next, tainted: next.tainted || cur.tainted };
      }
      return cur;
    }
    // dump values render code-table values as the bare label, so strip the
    // "CodeTable: " prefix off literals to compare in the same currency
    const code = /^[A-Za-z][\w ]*: (.+)$/.exec(t);
    if (code) return known(code[1], false);
    return OPAQUE;
  }

  function evalBool(cs, env, isAnd) {
    let tainted = false, undecided = false;
    const decide = r => {          // short-circuit result, or undefined
      if (r === OPAQUE) { undecided = true; return; }
      tainted = tainted || r.tainted;
      if (!r.known || (r.v !== "true" && r.v !== "false")) { undecided = true; return; }
      if (isAnd && r.v === "false") return known("false", r.tainted);
      if (!isAnd && r.v === "true") return known("true", r.tainted);
    };
    for (let i = 0; i < cs.length; i++) {
      // "For each … / Get:" sibling pair = exists (Any of) / forall (All of)
      if (/^For each entry in the list:?$/.test(txt(cs[i])) &&
          i + 1 < cs.length && /^Get:?$/.test(txt(cs[i + 1]))) {
        const src = evalLoopSrc(cs[i], env);
        i++;
        if (src === OPAQUE) { undecided = true; continue; }
        tainted = tainted || src.tainted;
        if (!src.known) { undecided = true; continue; }
        for (const oid of src.members) {
          env.items.push({ oid, type: typeOf(oid), name: src.name });
          const r = evalSeq(meaningful(cs[i].c), env);
          env.items.pop();
          const short = decide(r);
          if (short) return short;

      } else {
        const short = decide(evalItem(cs[i], env));
        if (short) return short;
      }

    if (undecided) return OPAQUE;
    return known(isAnd ? "true" : "false", tainted);
