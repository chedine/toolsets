<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zvec PDF Q&A</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #0f1115; color: #eef1f7; }
    header { padding: 18px 24px; border-bottom: 1px solid #2a2f3a; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    h1 { font-size: 20px; margin: 0; }
    .pill { font-size: 12px; color: #aeb7c8; border: 1px solid #303746; border-radius: 999px; padding: 6px 10px; }
    main { display: grid; grid-template-columns: 330px 1fr; min-height: calc(100vh - 66px); }
    aside { border-right: 1px solid #2a2f3a; padding: 18px; background: #131720; }
    section { padding: 18px; }
    .card { border: 1px solid #2a2f3a; background: #171c26; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    label { display: block; color: #c6cede; font-size: 13px; margin-bottom: 8px; }
    input[type=file], input[type=number], textarea { width: 100%; box-sizing: border-box; color: #eef1f7; background: #0f131b; border: 1px solid #333b4c; border-radius: 10px; padding: 10px; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 13px; background: #6ea8fe; color: #08111f; font-weight: 700; }
    button.secondary { background: #2a3140; color: #dbe5f5; }
    button.danger { background: #ff6b6b; color: #180808; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .doc { display: flex; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid #2a2f3a; padding: 10px 0; }
    .doc small, .muted { color: #95a0b3; }
    #chat { height: calc(100vh - 235px); overflow: auto; padding-right: 4px; }
    .msg { max-width: 920px; margin: 0 0 14px; padding: 13px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.45; }
    .user { margin-left: auto; background: #243a5e; }
    .assistant { background: #1b2230; border: 1px solid #2c3444; }
    .sources { margin-top: 8px; display: grid; gap: 8px; }
    details { border: 1px solid #303746; border-radius: 10px; padding: 9px 10px; background: #121720; }
    summary { cursor: pointer; color: #bdd3ff; }
    .composer { display: grid; grid-template-columns: 1fr 82px 90px; gap: 10px; align-items: end; border-top: 1px solid #2a2f3a; padding-top: 14px; }
    textarea { min-height: 74px; resize: vertical; }
    .status { color: #aeb7c8; min-height: 20px; font-size: 13px; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #2a2f3a; } #chat { height: 55vh; } }
  </style>
</head>
<body>
<header>
  <h1>zvec PDF Q&A demo</h1>
  <div id="config" class="pill">loading config…</div>
</header>
<main>
  <aside>
    <div class="card">
      <label>Upload PDF(s)</label>
      <input id="files" type="file" accept="application/pdf" multiple />
      <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
        <button id="uploadBtn">Upload</button>
        <span id="uploadStatus" class="status"></span>
      </div>
    </div>
    <div class="card">
      <strong>Documents</strong>
      <div id="docs" style="margin-top:8px;"></div>
    </div>
  </aside>
  <section>
    <div id="chat"></div>
    <div class="composer">
      <div>
        <label>Ask about uploaded PDFs</label>
        <textarea id="message" placeholder="What is this document about?"></textarea>
      </div>
      <div>
        <label>top k</label>
        <input id="topK" type="number" min="1" max="20" value="5" />
      </div>
      <button id="sendBtn">Send</button>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, options = {}) {
  const res = await fetch(path, options);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

function fmtTime(ts) { return new Date(ts * 1000).toLocaleString(); }

async function loadConfig() {
  const cfg = await api('/api/config');
  $('config').textContent = `embed: ${cfg.embedding_provider}/${cfg.embedding_model} (${cfg.embedding_dim}) · llm: ${cfg.llm_provider}${cfg.chat_model ? '/' + cfg.chat_model : ''}`;
}

async function loadDocs() {
  const {documents} = await api('/api/documents');
  const box = $('docs');
  if (!documents.length) { box.innerHTML = '<p class="muted">No PDFs uploaded yet.</p>'; return; }
  box.innerHTML = documents.map(d => `
    <div class="doc">
      <div><div>${escapeHtml(d.filename)}</div><small>${d.chunks} chunks · ${fmtTime(d.uploaded_at)}</small></div>
      <button class="danger" data-del="${d.id}">Delete</button>
    </div>`).join('');
  box.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
    if (!confirm('Delete this PDF and its zvec chunks?')) return;
    await api('/api/documents/' + btn.dataset.del, {method: 'DELETE'});
    await loadDocs(); await loadConfig();
  });
}

async function loadHistory() {
  const {messages} = await api('/api/history');
  for (const m of messages) appendMessage(m.role, m.content);
}

function appendMessage(role, text, sources = []) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  if (sources.length) {
    const src = document.createElement('div');
    src.className = 'sources';
    src.innerHTML = sources.map((s, i) => `
      <details>
        <summary>${i + 1}. ${escapeHtml(s.filename)} p.${s.page} · score ${Number(s.score).toFixed(4)}</summary>
        <div class="muted" style="margin-top:8px; white-space:pre-wrap;">${escapeHtml(s.text)}</div>
      </details>`).join('');
    div.appendChild(src);
  }
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

$('uploadBtn').onclick = async () => {
  const files = $('files').files;
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  $('uploadBtn').disabled = true; $('uploadStatus').textContent = 'indexing…';
  try {
    const res = await api('/api/upload', {method: 'POST', body: fd});
    $('uploadStatus').textContent = `uploaded ${res.uploaded.length}`;
    $('files').value = '';
    await loadDocs(); await loadConfig();
  } catch (e) { $('uploadStatus').textContent = e.message; }
  finally { $('uploadBtn').disabled = false; }
};

$('sendBtn').onclick = async () => {
  const msg = $('message').value.trim();
  if (!msg) return;
  $('message').value = '';
  appendMessage('user', msg);
  $('sendBtn').disabled = true;
  try {
    const res = await api('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, top_k: Number($('topK').value || 5)})
    });
    appendMessage('assistant', res.answer, res.sources);
  } catch (e) { appendMessage('assistant', 'Error: ' + e.message); }
  finally { $('sendBtn').disabled = false; }
};

$('message').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('sendBtn').click();
});

loadConfig().catch(e => $('config').textContent = e.message);
loadDocs().catch(console.error);
loadHistory().catch(console.error);
</script>
</body>
</html>
